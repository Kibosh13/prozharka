<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#8f6749" />
    <title>Оплата подписки — Прожарка</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&amp;family=Manrope:wght@400;500;600;700&amp;family=Tenor+Sans&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=15" />
  </head>
  <body class="payment-page" data-site-root="./">
    <main class="payment-shell">
      <a class="payment-brand" href="./">Про жарка</a>
      <section class="payment-card" data-payment-status>
        <p class="section-index">Подписка оформлена</p>
        <h1 data-payment-title>Проверяем<br />оплату.</h1>
        <p class="payment-message" data-payment-message>
          Обычно подтверждение занимает несколько секунд. Не закрывайте страницу.
        </p>
        <div class="payment-loader" data-payment-loader aria-hidden="true"><span></span></div>
        <a class="button payment-invite" data-payment-invite hidden rel="noopener">Войти в Telegram-канал</a>
        <p class="payment-help" data-payment-help>
          Если ссылка не появилась в течение пяти минут, напишите в поддержку и укажите email из заказа.
        </p>
      </section>
    </main>
    <script src="./script.js?v=9"></script>
  </body>
</html>
