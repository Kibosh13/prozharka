<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="theme-color" content="#8f6749">
    <title>Оплата подписки &mdash; Прожарка</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&amp;family=Manrope:wght@400;500;600;700&amp;family=Tenor+Sans&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css?v=16">
  </head>
  <body class="payment-page" data-site-root="./">
    <main class="payment-shell">
      <a class="payment-brand" href="./" data-cms-id="eda8e28bd065579b">Про жарка</a>
      <section class="payment-card" data-payment-status>
        <p class="section-index" data-cms-id="12b754ce8867cced">Подписка оформлена</p>
        <h1 data-payment-title data-cms-id="ee363195330a6d21">Проверяем<br>оплату.</h1>
        <p class="payment-message" data-payment-message data-cms-id="f9a2302b3417d0a2">
          Обычно подтверждение занимает несколько секунд. Не закрывайте страницу.
        </p>
        <div class="payment-loader" data-payment-loader aria-hidden="true"><span></span></div>
        <a class="button payment-invite" data-payment-invite hidden rel="noopener" data-cms-id="a03ca961f0bfcec5">Войти в Telegram-канал</a>
        <p class="payment-help" data-payment-help data-cms-id="21716d419d495026">
          Если ссылка не появилась в течение пяти минут, напишите в поддержку и укажите email из заказа.
        </p>
      </section>
    </main>
    <script src="./script.js?v=11"></script>
  </body>
